name: CI
on:
  push:
  pull_request:

# macOS only, deliberately. `say(1)` is macOS, so a green Linux run would prove
# nothing about the one platform this plugin runs on, and `extract.sh` leans on
# BSD awk and `sed -E` behaviour that is untested against GNU userland.
jobs:
  bats:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats and shellcheck
        run: brew install bats-core shellcheck

      - name: shellcheck
        run: |
          shellcheck -S warning -x scripts/*.sh install.sh uninstall.sh \
            agent-voice.tmux bin/tmux-agent-voice

      # lib/ is vendored from KakkoiDev/tmux-toolkit via git subtree. Editing it
      # in place is how five plugins accumulated 26 duplicated helpers, so lib/
      # is fingerprinted in lib/.checksum and this step fails on any unrecorded
      # edit. It compares lib/ against that committed fingerprint only; it does
      # not contact tmux-toolkit. This repo carries two deliberate divergences
      # in lib/menu.sh, documented in AGENTS.md and HANDOFF.md decision 8, so
      # do not "resync" lib/ from upstream to make this pass. Regenerate the
      # fingerprint with the same pipeline instead.
      - name: lib/ matches its committed fingerprint
        run: |
          have=$(find lib -name '*.sh' | sort | xargs shasum | shasum | cut -d' ' -f1)
          want=$(cat lib/.checksum)
          if [ "$have" != "$want" ]; then
            echo "lib/ does not match the fingerprint in lib/.checksum" >&2
            echo "  expected $want" >&2
            echo "  actual   $have" >&2
            exit 1
          fi
          echo "lib/ matches the fingerprint in lib/.checksum (vendored from tmux-toolkit $(cat lib/VERSION), plus this repo's two lib/menu.sh fixes)"

      - name: bats
        run: bats tests/

      # The suite must also pass under bash 3.2, the shell macOS ships, because
      # that is where a bare [[ ]] assertion silently passes. Pin the
      # interpreter rather than printing it: `bats` resolves to whichever bash
      # is first on PATH, and brew's bash 5 usually is.
      - name: confirm /bin/bash is 3.2
        run: /bin/bash --version | head -1 | grep 'version 3'

      - name: bats under bash 3.2
        run: /bin/bash "$(command -v bats)" tests/
